# ============================================================
# siyuan-plugin-meiday 仓库：每次 push 到 main 自动构建 package.zip 并发布到 GitHub Release
# 版本号规则：在最近一个 v* 标签上 +0.1.0（v1.6.0 -> v1.7.0），
# 仓库没有标签时从 v1.6.0 开始；也可手动触发时指定版本。
# 依赖：无需额外 Secrets（用默认 GITHUB_TOKEN 即可）。
# ============================================================
name: Build & Release (package.zip)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号（如 1.7.0），留空则自动在上一个版本 +0.1.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要全部历史/标签来计算版本
      - id: version
        shell: bash
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            echo "version=${OVERRIDE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [[ -z "$latest" ]]; then
            version="1.6.0"
          else
            IFS='.' read -r major minor _ <<< "$latest"
            minor=$((minor + 1))
            version="${major}.${minor}.0"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "下一版本: v${version}"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build plugin package
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: package.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [compute-version, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ needs.compute-version.outputs.version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG 已存在，跳过创建（可手动触发并指定新版本号）"
            exit 0
          fi
          gh release create "$TAG" artifacts/* \
            --title "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --generate-notes
          echo "已发布 v${VERSION}：package.zip"
