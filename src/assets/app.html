## 核心规则（最高优先级，必须死记）

在生成内容前，请先自检以下规则：

1. **层级限制**：仅支持“主任务（##）”和“子任务（###）”的二级结构。子任务只能用三级标题（###）创建，严禁使用 \`- [ ]\` 勾选框创建任务或子任务，严禁出现三级结构（子任务下不能再有子任务）。

3. **字段规范**：
   - 支持的字段：开始、截止、提醒、项目。时间格式必须为 \`YYYY-MM-DD HH:MM\`（HH为0-23）。

4. **重复任务**：多个同类型的重复任务，应合并到一个子任务中，不要拆分成多个。
